name: مصنع كيف يعمل

# كل سبت 1:17 ظهراً بتوقيت بغداد: يصنع فيديوهات الأسبوع القادم (الأحد → السبت)
# ويضعها في فرع videos مع manifest.json، ثم يرفعها Claude ويجدولها على يوتيوب.
#   شورت 6:00 عصراً + شورت 11:59 ليلاً كل يوم، وطويل الاثنين والجمعة 6:00 عصراً
on:
  schedule:
    - cron: "17 10 * * 6"
  workflow_dispatch:
    inputs:
      date:
        description: "أول يوم (مثال 2026-11-22) — فارغ = الغد"
        default: ""
      days:
        description: "عدد الأيام"
        default: "7"

permissions:
  contents: write

concurrency: factory

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libcairo2 > /dev/null
          pip install -q -r requirements.txt

      - name: صناعة فيديوهات الأسبوع
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAYF_VOICE: ${{ vars.KAYF_VOICE }}
          KAYF_TTS_FALLBACK: "0"
          PYTHONUNBUFFERED: "1"
          MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/videos/manifest.json
        run: |
          ARGS="--days ${{ github.event.inputs.days || '7' }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          python factory/daily.py $ARGS

      - name: نشر الفيديوهات في فرع videos
        run: |
          shopt -s nullglob
          FILES=(out/*/*.mp4)
          [ ${#FILES[@]} -eq 0 ] && { echo "لا شيء"; exit 0; }
          git clone -q --depth 1 -b videos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/v \
            || { mkdir -p /tmp/v && cd /tmp/v && git init -q -b videos && cd -; }
          python factory/merge_videos.py /tmp/v out
          cd /tmp/v
          git config user.name "kayf-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan fresh && git add -A && git commit -qm "فيديوهات $(date +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fresh:videos

      - name: حفظ حالة الطابور
        if: always()
        run: |
          git config user.name "kayf-bot"; git config user.email "bot@users.noreply.github.com"
          git add content topics.txt
          git commit -m "حلقات $(date +%F)" || echo "لا تغييرات"
          git pull --rebase origin main || true
          git push
