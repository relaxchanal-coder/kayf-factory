name: مصنع كيف يعمل

# كل يوم 1:17 ظهراً بتوقيت بغداد: يصنع فيديوهات «الغد» ويرسلها لـ Make
# فيرفعها على يوتيوب ويجدولها حسب schedule.json:
#   شورت 6:00 عصراً + شورت 11:59 ليلاً كل يوم، وطويل الاثنين والجمعة 6:00 عصراً
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "تاريخ يوم النشر (مثال 2026-11-23) — اتركه فارغاً لليوم التالي"
        default: ""

permissions:
  contents: write

concurrency: factory

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libcairo2 > /dev/null
          pip install -q -r requirements.txt

      - name: صناعة فيديوهات الغد
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAYF_VOICE: ${{ vars.KAYF_VOICE }}
          KAYF_TTS_FALLBACK: "0"
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python factory/daily.py --date "${{ github.event.inputs.date }}"
          else
            python factory/daily.py
          fi

      - name: رفع الملفات إلى Releases
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(out/*/*.mp4 out/*/*.jpg)
          if [ ${#FILES[@]} -eq 0 ]; then echo "لا شيء"; exit 0; fi
          TAG="d$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "${FILES[@]}" --title "فيديوهات $TAG" --notes "تُنشر تلقائياً عبر Make"
          echo "base=https://github.com/${{ github.repository }}/releases/download/$TAG" >> $GITHUB_OUTPUT

      - name: إرسال إلى Make للنشر المجدول
        if: steps.rel.outputs.base != ''
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          ASSETS_BASE: ${{ steps.rel.outputs.base }}
        run: python factory/publish.py

      - name: حفظ حالة الطابور
        if: always()
        run: |
          git config user.name "kayf-bot"; git config user.email "bot@users.noreply.github.com"
          git add content topics.txt
          git commit -m "حلقات $(date +%F)" || echo "لا تغييرات"
          git push
