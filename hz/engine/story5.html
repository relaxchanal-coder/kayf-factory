<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Q;src:url(__QFONT__)}
@font-face{font-family:A;src:url(__AFONT__)}
html,body{margin:0;width:__W__px;height:__H__px;overflow:hidden;background:#000;direction:rtl}
canvas{position:absolute;left:0;top:0}
#st{position:absolute;inset:0}
.a{position:absolute}
.q{font-family:Q;color:var(--g);text-shadow:0 0 30px rgba(var(--ac),.55),0 6px 18px #000}
.card{position:absolute;border-radius:var(--rad);background:linear-gradient(135deg,rgba(var(--ac),.20),rgba(var(--ac),.05) 60%,rgba(255,255,255,.03));border:2px solid rgba(var(--ac),.5);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.ph{position:absolute;overflow:hidden}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
</style>
<script src="__D3__"></script><script>__ILL__</script><script src="__TOPO__"></script>
</head><body><canvas id="bg" width="__W__" height="__H__"></canvas><canvas id="map" width="__W__" height="__H__"></canvas><div id="st"></div>
<script>
const D=__DATA__, WORLD=__WORLD__;
const V=D.o==='v', W=V?1080:1920,H=V?1920:1080, INK='#050507';
const bgc=document.getElementById('bg').getContext('2d'), mc=document.getElementById('map').getContext('2d'), st=document.getElementById('st');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), pr=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=cl(x);if(x>=1)return 1;return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2)};
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const norm=s=>String(s).replace(/[ً-ْـ،,.:؟!«»]/g,'');
const SC=D.scenes;
function cueT(sc,frag,fb){if(!frag)return fb??sc.start;for(const w of sc.words){if(norm(w.w).includes(norm(frag)))return sc.voice+w.t;}return fb??sc.voice+0.5}
// ---------- الألوان: لكل مشهد لوحة ألوان ----------
const PALS=[['#f2c14e','#ffe7a3'],['#ff5e7a','#ffc2cd'],['#2fe0a5','#b5ffe5'],['#4aa8ff','#c4e3ff'],['#b07cff','#e3d3ff'],['#ff8a4c','#ffd2b8'],['#19d3da','#b8f7f9'],['#ff4fd8','#ffc6f3']];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const OFF=D.poff||0;
function palOf(i){return PALS[(i*3+OFF)%PALS.length].map(hx)}
let GOLD,GOLD2,AC,AC2,LAND,BG0,BG1,RAD=D.rad||'22px';
function setPal(T){let i=0;SC.forEach((s,k)=>{if(T>=s.start)i=k});const k=eio(pr(T,SC[i].start-.15,.8));
  const p=i>0?palOf(i-1):palOf(i),c=palOf(i);const a=mix(p[0],c[0],k),b=mix(p[1],c[1],k);
  AC=a.join(','),AC2=b.join(',');GOLD=`rgb(${AC})`;GOLD2=`rgb(${AC2})`;
  LAND=`rgb(${mix(a,[8,8,12],.8).join(',')})`;BG0=mix(a,[6,6,10],.84);BG1=mix(a,[3,3,6],.94);
  st.style.setProperty('--g',GOLD);st.style.setProperty('--ac',AC);st.style.setProperty('--rad',RAD);}
// ---------- الخريطة ----------
const land=topojson.feature(WORLD,WORLD.objects.countries);
const borders=topojson.mesh(WORLD,WORLD.objects.countries,(a,b)=>a!==b);
const grat=d3.geoGraticule().step([15,15])();
// كل نقاط الرحلة بالترتيب مع زمن ظهورها
const ROUTE=[]; const LABELS=[]; const SPOKES=[];
SC.forEach((sc,i)=>{ if(sc.type!=='map') return;
  if(sc.hub){const t=cueT(sc,sc.hub.cue);LABELS.push({n:sc.hub.n,ll:sc.hub.ll,t,big:1,scene:i});}
  (sc.pts||[]).forEach(p=>{const t=cueT(sc,p.cue);
    if(p.spoke&&sc.hub) SPOKES.push({a:p.ll,b:sc.hub.ll,t,scene:i}); else if(!p.noroute) ROUTE.push({ll:p.ll,t});
    if(p.n) LABELS.push({n:p.n,ll:p.ll,t,big:p.big,scene:i});});
});
function camAt(T){
  let cur=-1,prev=-1;
  SC.forEach((s,i)=>{if(s.type==='map'&&T>=s.start-0.0) {prev=cur; cur=i;}});
  if(cur<0) cur=SC.findIndex(s=>s.type==='map');
  const c=SC[cur].cam, p=prev>=0?SC[prev].cam:c;
  const k=eio(pr(T,SC[cur].start,1.8));
  const lz=Math.log(p[2])+(Math.log(c[2])-Math.log(p[2]))*k;
  return [p[0]+(c[0]-p[0])*k, p[1]+(c[1]-p[1])*k, Math.exp(lz)];
}
function drawMap(T, vis){
  mc.clearRect(0,0,W,H); if(vis<=0||!SC.some(s=>s.type==='map')) return null;
  const [lon,lat,sc]=camAt(T);
  const proj=d3.geoMercator().center([lon,lat]).scale(sc).translate([W/2,V?H*0.3:H/2+30]);
  const path=d3.geoPath(proj,mc);
  mc.globalAlpha=vis;
  mc.beginPath();path(grat);mc.strokeStyle=`rgba(${AC},.07)`;mc.lineWidth=1;mc.stroke();
  mc.beginPath();path(land);mc.fillStyle=LAND;mc.fill();
  mc.beginPath();path(borders);mc.strokeStyle=`rgba(${AC},.22)`;mc.lineWidth=1;mc.stroke();
  mc.beginPath();path(land);mc.strokeStyle=`rgba(${AC},.45)`;mc.lineWidth=1.4;mc.stroke();
  // المسار
  for(let k=1;k<ROUTE.length;k++){
    const a=ROUTE[k-1],b=ROUTE[k]; const t0=Math.max(a.t,b.t-1.6), q=pr(T,t0,b.t-t0||0.01); if(q<=0) continue;
    const ip=d3.geoInterpolate(a.ll,b.ll), n=48;
    mc.beginPath(); for(let j=0;j<=n;j++){const p=proj(ip(j/n*q));if(!p)continue; j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]);}
    mc.setLineDash([10,8]); mc.strokeStyle=GOLD; mc.lineWidth=4; mc.shadowColor=GOLD; mc.shadowBlur=12; mc.stroke(); mc.setLineDash([]); mc.shadowBlur=0;
    if(q<1){const h=proj(ip(q));mc.fillStyle=GOLD2;mc.beginPath();mc.arc(h[0],h[1],9,0,6.283);mc.fill();mc.strokeStyle=`rgba(${AC2},.5)`;mc.lineWidth=3;mc.beginPath();mc.arc(h[0],h[1],16+6*Math.sin(T*8),0,6.283);mc.stroke();}
  }
  for(const S of SPOKES){const q=pr(T,S.t-.2,1.4); if(q<=0) continue; const ip=d3.geoInterpolate(S.a,S.b),n=48;
    mc.beginPath(); for(let j=0;j<=n;j++){const p=proj(ip(j/n*q));if(!p)continue; j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]);}
    mc.strokeStyle=GOLD; mc.lineWidth=5; mc.shadowColor=GOLD; mc.shadowBlur=14; mc.stroke(); mc.shadowBlur=0;
    const h=proj(ip(q)); if(h){mc.fillStyle=GOLD2;mc.beginPath();mc.arc(h[0],h[1],10,0,6.283);mc.fill();}}
  mc.globalAlpha=1;
  return proj;
}

// ---------- الخلفية ----------
const RR=rng(7),DUST=[];for(let i=0;i<110;i++)DUST.push({x:RR()*W,y:RR()*H,r:.6+RR()*2.4,v:4+RR()*12,p:RR()*6.28});
const BLOBS=[];for(let i=0;i<6;i++)BLOBS.push({x:RR(),y:RR(),r:.35+RR()*.4,sx:.03+RR()*.05,sy:.02+RR()*.05,p:RR()*6.28,c:i%2});
const PATS=['hex','grid','rings','stars','diag','dots'];
function bg(T,si){
  bgc.fillStyle=`rgb(${BG1.join(',')})`;bgc.fillRect(0,0,W,H);
  for(const b of BLOBS){const x=(b.x+.18*Math.sin(T*b.sx*6+b.p))*W,y=(b.y+.18*Math.cos(T*b.sy*6+b.p))*H,r=b.r*Math.max(W,H);
    const g=bgc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${b.c?AC2:AC},${b.c?.10:.16})`);g.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);}
  const v=bgc.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');bgc.fillStyle=v;bgc.fillRect(0,0,W,H);
  const P=PATS[(si+OFF)%PATS.length];bgc.save();bgc.strokeStyle=`rgba(${AC},.08)`;bgc.fillStyle=`rgba(${AC},.10)`;bgc.lineWidth=1.5;
  if(P==='hex'){const r=64,h=r*Math.sqrt(3),o=(T*10)%h;for(let row=-2;row*h*.5<H+h;row++)for(let col=-1;col*r*3<W+r*3;col++){const cx=col*r*3+(row%2?r*1.5:0),cy=row*h*.5+o;bgc.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3;bgc.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}bgc.closePath();bgc.stroke();}}
  else if(P==='grid'){const s=80,o=(T*14)%s;for(let x=o-s;x<W+s;x+=s){bgc.beginPath();bgc.moveTo(x,0);bgc.lineTo(x,H);bgc.stroke();}for(let y=o-s;y<H+s;y+=s){bgc.beginPath();bgc.moveTo(0,y);bgc.lineTo(W,y);bgc.stroke();}}
  else if(P==='rings'){bgc.translate(W/2,H/2);for(let i=0;i<16;i++){bgc.save();bgc.rotate(T*(i%2?.08:-.08));bgc.setLineDash([40+i*5,24]);bgc.beginPath();bgc.arc(0,0,100+i*110,0,6.283);bgc.stroke();bgc.restore();}}
  else if(P==='stars'){const s=170,o=(T*12)%s;for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){const cx=x+(Math.round(y/s)%2?s/2:0),cy=y+o;bgc.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8+T*.08,r=k%2?24:56;bgc.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}bgc.closePath();bgc.stroke();}}
  else if(P==='diag'){const s=70,o=(T*30)%s;for(let x=-H+o;x<W+H;x+=s){bgc.beginPath();bgc.moveTo(x,0);bgc.lineTo(x-H*.6,H);bgc.stroke();}}
  else {const s=60,o=(T*8)%s;for(let x=0;x<W+s;x+=s)for(let y=o-s;y<H+s;y+=s){bgc.beginPath();bgc.arc(x,y,2.2+1.2*Math.sin(T*2+x*.01+y*.013),0,6.283);bgc.fill();}}
  bgc.restore();
}
function dust(T){let s='';for(const d of DUST){const y=((d.y-T*d.v)%H+H)%H,x=d.x+Math.sin(T*.4+d.p)*18;s+=`<circle cx="${x}" cy="${y}" r="${d.r}" fill="${GOLD2}" opacity="${.15+.3*Math.sin(T*1.2+d.p*3)}"/>`;}return `<svg class="a" style="left:0;top:0" width="${W}" height="${H}">${s}</svg>`}
const fmt=(str,p)=>{const v=parseFloat(String(str).replace(/,/g,''));const n=Math.round(v*p);return String(str).includes(',')||v>=10000?n.toLocaleString('en-US'):String(n)};
const IMG=f=>D.img+'/'+f;
// ---------- الصور ----------
function kb(sc,T,i){const p=cl((T-sc.start)/sc.dur),dir=i%4;const s=1.08+.14*p;const dx=[1,-1,0,0][dir]*40*(p-.5),dy=[0,0,1,-1][dir]*30*(p-.5);return `transform:scale(${s}) translate(${dx}px,${dy}px)`}
function photoPanel(sc,T,t,i){ // لوحة صورة جانبية مع كشف مائل
  const k=eio(pr(t,0,.9)),img=sc.img;
  if(!V){const w=880,edge=150;const xr=w*k;
    return `<div class="ph" style="left:0;top:0;width:${W}px;height:${H}px;clip-path:polygon(0 0,${xr}px 0,${xr-edge}px ${H}px,0 ${H}px)"><img src="${IMG(img)}" style="${kb(sc,T,i)}"><div class="a" style="inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.15) 60%,rgba(${BG1.join(',')},.85)),linear-gradient(0deg,rgba(${AC},.22),rgba(0,0,0,0) 45%)"></div></div>
    <svg class="a" style="left:0;top:0" width="${W}" height="${H}"><line x1="${xr}" y1="0" x2="${xr-edge}" y2="${H}" stroke="${GOLD}" stroke-width="6" style="filter:drop-shadow(0 0 14px ${GOLD})"/><line x1="${xr+26}" y1="0" x2="${xr-edge+26}" y2="${H}" stroke="${GOLD2}" stroke-width="2" opacity=".6"/></svg>`;}
  const h=820,edge=120;const yb=h*k;
  return `<div class="ph" style="left:0;top:0;width:${W}px;height:${H}px;clip-path:polygon(0 0,${W}px 0,${W}px ${yb-edge}px,0 ${yb}px)"><img src="${IMG(img)}" style="${kb(sc,T,i)};height:${h+40}px"><div class="a" style="left:0;top:0;width:${W}px;height:${h}px;background:linear-gradient(0deg,rgba(${BG1.join(',')},.9),rgba(0,0,0,0) 40%),linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 25%)"></div></div>
   <svg class="a" style="left:0;top:0" width="${W}" height="${H}"><line x1="${W}" y1="${yb-edge}" x2="0" y2="${yb}" stroke="${GOLD}" stroke-width="6" style="filter:drop-shadow(0 0 14px ${GOLD})"/></svg>`;
}
function photoCard(sc,T,i){ // صورة عائمة فوق الخريطة عند نطق الكلمة
  const ct=cueT(sc,sc.imgcue,sc.voice+.8),k=eb(pr(T,ct-.1,.7));if(k<=0)return'';
  const [x,y,w,h]=V?[90,930,900,470]:[1240,190,600,440];const rot=(i%2?3:-3)*(1-k)+(i%2?1.5:-1.5);
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:translateY(${(1-k)*80}px) rotate(${rot}deg) scale(${.85+.15*k});opacity:${cl(k*1.4)}">
   <div class="ph" style="inset:0;border-radius:18px;border:4px solid ${GOLD};box-shadow:0 0 40px rgba(${AC},.5),0 30px 60px rgba(0,0,0,.6)"><img src="${IMG(sc.img)}" style="${kb(sc,T,i)}"></div>
   ${sc.cap?`<div class="a" style="right:-10px;bottom:-26px;padding:6px 22px;border-radius:12px;background:${GOLD};color:${INK};font-family:A;font-size:${V?40:34}px">${sc.cap}</div>`:''}</div>`;
}

// ---------- المجسّمات والشخصيات (مربوطة بالكلمات) ----------
function ills(sc){return (sc.ill||[]).map(x=>typeof x==='string'||x.char||x.k?{d:x.d||x,cue:x.cue}:x)}
function stage(sc,T,t,bx,i,card){const L=ills(sc);if(!L.length)return'';
  const ts=L.map((x,j)=>j===0&&!x.cue?sc.start+.15:cueT(sc,x.cue,sc.start+.15));
  let cur=0;ts.forEach((c,j)=>{if(T>=c-.25)cur=j});
  let h='';
  for(const j of [cur-1,cur]){if(j<0)continue;const k=cl((T-ts[j]+.25)/1.6+(i===0?.65:0));let op=1,sc2=1;
    if(j<cur){const q=cl((T-ts[cur]+.25)/.45);op=1-q;sc2=1-.15*q;if(op<=0)continue;}
    const d=L[j].d;const isChar=(typeof d==='string'&&d.startsWith('char:'))||d.char;
    h+=`<div class="a" style="left:0;top:0;width:100%;height:100%;opacity:${op};transform:scale(${sc2})">${DRAW(d,k,T,GOLD,GOLD2)}</div>`;}
  const pl=i===0?1:eo(pr(t,0,.6));
  const deco=`<svg class="a" style="left:0;top:0;overflow:visible" width="${bx.w}" height="${bx.h}"><defs><radialGradient id="pg${i}"><stop offset="0" stop-color="rgb(${AC})" stop-opacity=".45"/><stop offset="1" stop-color="rgb(${AC})" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${bx.w/2}" cy="${bx.h*.48}" r="${Math.min(bx.w,bx.h)*.55*pl}" fill="url(#pg${i})"/>
    <g transform="translate(${bx.w/2},${bx.h*.48}) rotate(${T*12})"><circle r="${Math.min(bx.w,bx.h)*.46*pl}" fill="none" stroke="rgb(${AC})" stroke-width="3" stroke-dasharray="14 18" opacity=".55"/></g>
    <g transform="translate(${bx.w/2},${bx.h*.48}) rotate(${-T*8})"><circle r="${Math.min(bx.w,bx.h)*.5*pl}" fill="none" stroke="rgb(${AC2})" stroke-width="2" stroke-dasharray="4 26" opacity=".6"/></g></svg>`;
  if(card){const k=eb(pr(T,ts[0]-.1,.7));return `<div class="a" style="left:${bx.x}px;top:${bx.y}px;width:${bx.w}px;height:${bx.h}px;opacity:${cl(k*1.4)};transform:translateY(${(1-k)*80}px) scale(${.85+.15*k})">
     <div class="a" style="inset:0;border-radius:36px;background:radial-gradient(circle at 50% 45%,rgba(${AC},.28),rgba(${BG1.join(',')},.92) 70%);border:3px solid ${GOLD};box-shadow:0 0 40px rgba(${AC},.45),0 30px 60px rgba(0,0,0,.6)"></div>
     <div class="a" style="left:4%;top:4%;width:92%;height:92%">${h}</div></div>`;}
  return `<div class="a" style="left:${bx.x}px;top:${bx.y}px;width:${bx.w}px;height:${bx.h}px">${deco}<div class="a" style="left:3%;top:3%;width:94%;height:94%">${h}</div></div>`;
}
// ---------- مشاهد المحتوى (داخل صندوق B) ----------
const R={};
function line(B,top,k){return `<svg class="a" style="left:${B.cx-180}px;top:${top}px" width="360" height="20"><line x1="${180-180*k}" y1="10" x2="${180+180*k}" y2="10" stroke="${GOLD}" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="10" r="${9*k}" fill="${GOLD2}"/></svg>`}
R.title=(sc,T,t,B)=>{if(sc.hook){const he=cueT(sc,sc.titlecue,sc.voice+2.4);if(T<he+.35){const out=cl((T-he)/.35);const ws=sc.hook.split(' ');const fs=V?(sc.hook.length>22?96:116):110;const pop=1+.06*Math.sin(Math.min(T,1)*Math.PI);const hw=ws.map((w,j)=>{const q=eb(pr(T,-.25+j*.07,.3));const hot=(sc.hot||[]).some(x=>w.includes(x));return `<span style="display:inline-block;margin:0 .14em;opacity:${cl(q*1.6)};transform:scale(${.7+.3*q});${hot?`background:${GOLD};color:${INK};border-radius:16px;padding:0 .18em;`:''}">${w}</span>`}).join('');return `<div class="a q" style="left:${B.cx-B.w/2}px;width:${B.w}px;top:${B.top+10}px;text-align:center;font-size:${fs}px;line-height:1.35;color:#fff;opacity:${1-out};transform:scale(${pop*(1-.2*out)});text-shadow:0 6px 24px #000">${hw}</div>`}}const tt=sc.hook?Math.max(0,T-cueT(sc,sc.titlecue,sc.voice+2.4)-.2):t;t=tt;const k=eo(pr(t,.15,1)),kn=eb(pr(T,cueT(sc,sc.numcue),.6)),cnt=eo(pr(T,cueT(sc,sc.numcue),1.6));
  const fs=B.split?(V?110:130):(V?(sc.text.length>10?120:150):170);
  // حروف العنوان تتساقط كلمة كلمة
  const ws=sc.text.split(' ');const tw=ws.map((w,j)=>{const q=eb(pr(t,.15+j*.18,.6));return `<span style="display:inline-block;opacity:${cl(q*1.5)};transform:translateY(${(1-q)*-60}px) scale(${.8+.2*q});margin:0 .12em">${w}</span>`}).join('');
  let h=line(B,B.top,k)+`<div class="a q" style="left:${B.cx-B.w/2}px;width:${B.w}px;top:${B.top+40}px;text-align:center;font-size:${fs}px;line-height:1.3">${tw}</div>
  <div class="a" style="left:${B.cx-B.w/2}px;width:${B.w}px;top:${B.top+60+fs*1.35}px;text-align:center;font-family:A;font-size:${V?56:54}px;color:#fff;opacity:${eo(pr(t,.9,.8))};transform:translateY(${(1-eo(pr(t,.9,.8)))*20}px)">${sc.sub}</div>`;
  if(sc.num) h+=`<div class="a" style="left:${B.cx-B.w/2}px;width:${B.w}px;top:${B.top+150+fs*1.35}px;text-align:center;opacity:${cl(kn*1.5)};transform:scale(${.7+.3*kn})"><span style="display:inline-block;padding:4px 40px;border-radius:60px;background:rgba(${AC},.16);border:2px solid rgba(${AC},.6)"><span style="font-family:A;font-size:${V?110:100}px;color:${GOLD};direction:ltr;display:inline-block;text-shadow:0 0 30px rgba(${AC},.6)">${fmt(sc.num,cnt)}</span><span style="font-family:A;font-size:54px;color:#fff;margin-right:18px">${sc.unit}</span></span></div>`;
  return h};
R.bullets=(sc,T,t,B)=>{const k=eo(pr(t,.1,.7));const hs=B.split?(V?84:96):(V?108:110);

R.stats=(sc,T,t,B)=>{let h='';const n=sc.items.length;sc.items.forEach((it,i)=>{const ct=cueT(sc,it.cue),k=eb(pr(T,ct-.15,.6)),c=eo(pr(T,ct-.15,1.4));if(k<=0)return;

// ---------- الترجمة ----------
function subs(sc,T,B){
  if(sc.type==='outro')return'';
  const cues=new Set();(sc.pts||[]).forEach(p=>cues.add(norm(p.cue)));(sc.items||[]).forEach(p=>p.cue&&cues.add(norm(p.cue)));if(sc.numcue)cues.add(norm(sc.numcue));

function sweep(sc,t,i){if(i===0||t>.75)return'';const p=eio(pr(t,0,.75));const x=(-0.4+1.8*p)*W;

function frame(T){

  {const c0=D.total*.42,k=eb(pr(T,c0,.45))*cl((c0+3.2-T)/.4);if(k>0&&D.total>20)h+=`<div class="a" style="left:${V?60:70}px;top:${V?150:110}px;display:flex;align-items:center;gap:14px;padding:10px 30px;border-radius:50px;background:linear-gradient(135deg,#ff3030,#c00);font-family:A;font-size:${V?46:40}px;color:#fff;opacity:${cl(k*1.4)};transform:scale(${(.6+.4*k)*(1+.05*Math.sin(T*8))});transform-origin:left center;box-shadow:0 10px 30px rgba(255,0,0,.45)"><span style="font-size:1.1em">🔔</span>تابِع حكايا الزمان</div>`;}
