</head><body><canvas id="bg" width="__W__" height="__H__"></canvas><canvas id="map" width="__W__" height="__H__"></canvas><div id="st"></div>
<script>
const D=__DATA__, WORLD=__WORLD__;
const V=D.o==='v', W=V?1080:1920,H=V?1920:1080, INK='#050507';
const bgc=document.getElementById('bg').getContext('2d'), mc=document.getElementById('map').getContext('2d'), st=document.getElementById('st');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), pr=(t,a,d)=>cl((t-a)/d);
const eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eb=x=>{x=cl(x);if(x>=1)return 1;return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2)};
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const norm=s=>String(s).replace(/[ً-ْـ،,.:؟!«»]/g,'');
const SC=D.scenes;
function cueT(sc,frag,fb){if(!frag)return fb??sc.start;for(const w of sc.words){if(norm(w.w).includes(norm(frag)))return sc.voice+w.t;}return fb??sc.voice+0.5}
// ---------- الألوان: لكل مشهد لوحة ألوان ----------
const PALSETS={jewel:[['#f2c14e','#ffe7a3'],['#ff5e7a','#ffc2cd'],['#2fe0a5','#b5ffe5'],['#4aa8ff','#c4e3ff'],['#b07cff','#e3d3ff'],['#ff8a4c','#ffd2b8'],['#19d3da','#b8f7f9'],['#ff4fd8','#ffc6f3']],
 earth:[['#e0a458','#ffe0b5'],['#c8553d','#f6c3b5'],['#8ab17d','#dcefd3'],['#d4a373','#f5e1c8'],['#e9c46a','#fff1c2'],['#b5838d','#ecd4d9']],
 sea:[['#22d3ee','#c5f6fd'],['#38bdf8','#cbeafe'],['#2dd4bf','#c3faf0'],['#60a5fa','#d6e6ff'],['#a78bfa','#e6dcff']],
 fire:[['#ff6b35','#ffd0bd'],['#f7c548','#fff0be'],['#ff3864','#ffc2cf'],['#ff9f1c','#ffe2b8']],
 royal:[['#d4af37','#f7e7a8'],['#9b5de5','#e2cff9'],['#c0c0d8','#ffffff'],['#e0b0ff','#f6e6ff']],
 neon:[['#00f5d4','#b8fff3'],['#f15bb5','#ffc8e8'],['#fee440','#fff8b8'],['#00bbf9','#bdeeff'],['#9b5de5','#e2cff9']]};
const PALS0=[['#f2c14e','#ffe7a3'],['#ff5e7a','#ffc2cd'],['#2fe0a5','#b5ffe5'],['#4aa8ff','#c4e3ff'],['#b07cff','#e3d3ff'],['#ff8a4c','#ffd2b8'],['#19d3da','#b8f7f9'],['#ff4fd8','#ffc6f3']];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const OFF=D.poff||0;
const PALS=(D.style&&PALSETS[D.style.pal])||PALS0;
function palOf(i){return PALS[(i*(PALS.length>5?3:1)+OFF)%PALS.length].map(hx)}
let GOLD,GOLD2,AC,AC2,LAND,BG0,BG1,RAD=D.rad||'22px';
function setPal(T){let i=0;SC.forEach((s,k)=>{if(T>=s.start)i=k});const k=eio(pr(T,SC[i].start-.15,.8));
  const p=i>0?palOf(i-1):palOf(i),c=palOf(i);const a=mix(p[0],c[0],k),b=mix(p[1],c[1],k);
  AC=a.join(','),AC2=b.join(',');GOLD=`rgb(${AC})`;GOLD2=`rgb(${AC2})`;
  LAND=`rgb(${mix(a,[8,8,12],.8).join(',')})`;BG0=mix(a,[6,6,10],.84);BG1=mix(a,[3,3,6],.94);
  st.style.setProperty('--g',GOLD);st.style.setProperty('--ac',AC);st.style.setProperty('--rad',RAD);}
// ---------- الخريطة ----------
const land=topojson.feature(WORLD,WORLD.objects.countries);
const borders=topojson.mesh(WORLD,WORLD.objects.countries,(a,b)=>a!==b);
const grat=d3.geoGraticule().step([15,15])();
// كل نقاط الرحلة بالترتيب مع زمن ظهورها
const ROUTE=[]; const LABELS=[]; const SPOKES=[];
SC.forEach((sc,i)=>{ if(sc.type!=='map') return;
  if(sc.hub){const t=cueT(sc,sc.hub.cue);LABELS.push({n:sc.hub.n,ll:sc.hub.ll,t,big:1,scene:i});}
  (sc.pts||[]).forEach(p=>{const t=cueT(sc,p.cue);
    if(p.spoke&&sc.hub) SPOKES.push({a:p.ll,b:sc.hub.ll,t,scene:i}); else if(!p.noroute) ROUTE.push({ll:p.ll,t});
    if(p.n) LABELS.push({n:p.n,ll:p.ll,t,big:p.big,scene:i});});
});
function camAt(T){
  let cur=-1,prev=-1;
  SC.forEach((s,i)=>{if(s.type==='map'&&T>=s.start-0.0) {prev=cur; cur=i;}});
  if(cur<0) cur=SC.findIndex(s=>s.type==='map');
  const c=SC[cur].cam, p=prev>=0?SC[prev].cam:c;
  const k=eio(pr(T,SC[cur].start,1.8));
  const lz=Math.log(p[2])+(Math.log(c[2])-Math.log(p[2]))*k;
  return [p[0]+(c[0]-p[0])*k, p[1]+(c[1]-p[1])*k, Math.exp(lz)];
}
function drawMap(T, vis){
  mc.clearRect(0,0,W,H); if(vis<=0||!SC.some(s=>s.type==='map')) return null;
  const [lon,lat,sc]=camAt(T);
  const proj=d3.geoMercator().center([lon,lat]).scale(sc).translate([W/2,V?H*0.3:H/2+30]);
  const path=d3.geoPath(proj,mc);
  mc.globalAlpha=vis;
  mc.beginPath();path(grat);mc.strokeStyle=`rgba(${AC},.07)`;mc.lineWidth=1;mc.stroke();
  mc.beginPath();path(land);mc.fillStyle=LAND;mc.fill();
  mc.beginPath();path(borders);mc.strokeStyle=`rgba(${AC},.22)`;mc.lineWidth=1;mc.stroke();
  mc.beginPath();path(land);mc.strokeStyle=`rgba(${AC},.45)`;mc.lineWidth=1.4;mc.stroke();
  // المسار
  for(let k=1;k<ROUTE.length;k++){
    const a=ROUTE[k-1],b=ROUTE[k]; const t0=Math.max(a.t,b.t-1.6), q=pr(T,t0,b.t-t0||0.01); if(q<=0) continue;
    const ip=d3.geoInterpolate(a.ll,b.ll), n=48;
    mc.beginPath(); for(let j=0;j<=n;j++){const p=proj(ip(j/n*q));if(!p)continue; j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]);}
    mc.setLineDash([10,8]); mc.strokeStyle=GOLD; mc.lineWidth=4; mc.shadowColor=GOLD; mc.shadowBlur=12; mc.stroke(); mc.setLineDash([]); mc.shadowBlur=0;
    if(q<1){const h=proj(ip(q));mc.fillStyle=GOLD2;mc.beginPath();mc.arc(h[0],h[1],9,0,6.283);mc.fill();mc.strokeStyle=`rgba(${AC2},.5)`;mc.lineWidth=3;mc.beginPath();mc.arc(h[0],h[1],16+6*Math.sin(T*8),0,6.283);mc.stroke();}
  }
  for(const S of SPOKES){const q=pr(T,S.t-.2,1.4); if(q<=0) continue; const ip=d3.geoInterpolate(S.a,S.b),n=48;
    mc.beginPath(); for(let j=0;j<=n;j++){const p=proj(ip(j/n*q));if(!p)continue; j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]);}
    mc.strokeStyle=GOLD; mc.lineWidth=5; mc.shadowColor=GOLD; mc.shadowBlur=14; mc.stroke(); mc.shadowBlur=0;
    const h=proj(ip(q)); if(h){mc.fillStyle=GOLD2;mc.beginPath();mc.arc(h[0],h[1],10,0,6.283);mc.fill();}}
  mc.globalAlpha=1;
  return proj;
}

// ---------- الخلفية ----------
const RR=rng(7),DUST=[];for(let i=0;i<110;i++)DUST.push({x:RR()*W,y:RR()*H,r:.6+RR()*2.4,v:4+RR()*12,p:RR()*6.28});
const BLOBS=[];for(let i=0;i<6;i++)BLOBS.push({x:RR(),y:RR(),r:.35+RR()*.4,sx:.03+RR()*.05,sy:.02+RR()*.05,p:RR()*6.28,c:i%2});
const PATS=['hex','grid','rings','stars','diag','dots'];
function bg(T,si){if(SY.bg!=='glow'&&BGS[SY.bg]){BGS[SY.bg](T,si);return;}
  bgc.fillStyle=`rgb(${BG1.join(',')})`;bgc.fillRect(0,0,W,H);
  for(const b of BLOBS){const x=(b.x+.18*Math.sin(T*b.sx*6+b.p))*W,y=(b.y+.18*Math.cos(T*b.sy*6+b.p))*H,r=b.r*Math.max(W,H);
    const g=bgc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${b.c?AC2:AC},${b.c?.10:.16})`);g.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);}
  const v=bgc.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');bgc.fillStyle=v;bgc.fillRect(0,0,W,H);
  const P=PATS[(si+OFF)%PATS.length];bgc.save();bgc.strokeStyle=`rgba(${AC},.08)`;bgc.fillStyle=`rgba(${AC},.10)`;bgc.lineWidth=1.5;
  if(P==='hex'){const r=64,h=r*Math.sqrt(3),o=(T*10)%h;for(let row=-2;row*h*.5<H+h;row++)for(let col=-1;col*r*3<W+r*3;col++){const cx=col*r*3+(row%2?r*1.5:0),cy=row*h*.5+o;bgc.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3;bgc.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}bgc.closePath();bgc.stroke();}}
  else if(P==='grid'){const s=80,o=(T*14)%s;for(let x=o-s;x<W+s;x+=s){bgc.beginPath();bgc.moveTo(x,0);bgc.lineTo(x,H);bgc.stroke();}for(let y=o-s;y<H+s;y+=s){bgc.beginPath();bgc.moveTo(0,y);bgc.lineTo(W,y);bgc.stroke();}}
  else if(P==='rings'){bgc.translate(W/2,H/2);for(let i=0;i<16;i++){bgc.save();bgc.rotate(T*(i%2?.08:-.08));bgc.setLineDash([40+i*5,24]);bgc.beginPath();bgc.arc(0,0,100+i*110,0,6.283);bgc.stroke();bgc.restore();}}
  else if(P==='stars'){const s=170,o=(T*12)%s;for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){const cx=x+(Math.round(y/s)%2?s/2:0),cy=y+o;bgc.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8+T*.08,r=k%2?24:56;bgc.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}bgc.closePath();bgc.stroke();}}
  else if(P==='diag'){const s=70,o=(T*30)%s;for(let x=-H+o;x<W+H;x+=s){bgc.beginPath();bgc.moveTo(x,0);bgc.lineTo(x-H*.6,H);bgc.stroke();}}
  else {const s=60,o=(T*8)%s;for(let x=0;x<W+s;x+=s)for(let y=o-s;y<H+s;y+=s){bgc.beginPath();bgc.arc(x,y,2.2+1.2*Math.sin(T*2+x*.01+y*.013),0,6.283);bgc.fill();}}
  bgc.restore();
}
// ================= نظام الستايلات: كل فيديو بشكل مختلف =================
const SY=Object.assign({bg:'glow',tr:'sweep',ent:'left',sub:'box',frame:'ring',part:'dust',cam:'none'},D.style||{});
const SR=rng(11),STARS=[];for(let i=0;i<260;i++)STARS.push({x:SR()*W,y:SR()*H,r:.4+SR()*1.8,p:SR()*6.28,s:.5+SR()*2});
const TRI=[];{const n=V?7:12,m=V?12:7,cw=W/(n-1),ch=H/(m-1);const P=[];for(let y=0;y<m;y++){P.push([]);for(let x=0;x<n;x++){const j=(x>0&&x<n-1)?(SR()-.5)*cw*.7:0,k=(y>0&&y<m-1)?(SR()-.5)*ch*.7:0;P[y].push([x*cw+j,y*ch+k,SR()*6.28]);}}
 for(let y=0;y<m-1;y++)for(let x=0;x<n-1;x++){const a=P[y][x],b=P[y][x+1],c=P[y+1][x],d=P[y+1][x+1];TRI.push([a,b,c]);TRI.push([b,d,c]);}}
const BOK=[];for(let i=0;i<22;i++)BOK.push({x:SR(),y:SR(),r:30+SR()*120,v:.01+SR()*.03,p:SR()*6.28,c:i%2});
function vign(a){const v=bgc.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${a})`);bgc.fillStyle=v;bgc.fillRect(0,0,W,H);}
function star8(cx,cy,r,rot){bgc.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8+rot,rr=k%2?r*.42:r;bgc.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}bgc.closePath();}
const BGS={
 cosmic(T){const g=bgc.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${BG1.join(',')})`);g.addColorStop(1,'#020208');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  for(const [x,y,r,c,s] of [[.25,.3,.7,AC,.22],[.8,.7,.6,AC2,.14],[.6,.15,.4,AC,.12]]){const cx=(x+.05*Math.sin(T*.1+r*9))*W,cy=(y+.05*Math.cos(T*.08+r*7))*H,R=r*Math.max(W,H);const q=bgc.createRadialGradient(cx,cy,0,cx,cy,R);q.addColorStop(0,`rgba(${c},${s})`);q.addColorStop(.5,`rgba(${c},${s*.35})`);q.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=q;bgc.fillRect(0,0,W,H);}
  for(const s of STARS){const tw=.35+.65*Math.abs(Math.sin(T*s.s+s.p));bgc.fillStyle=`rgba(255,255,255,${tw*.85})`;bgc.beginPath();bgc.arc(s.x,(s.y+T*4*s.r)%H,s.r,0,6.283);bgc.fill();}
  const sh=(T*.23)%1;if(sh<.18){const p=sh/.18,x0=W*(.9-p*.8),y0=H*(.08+p*.25);const l=bgc.createLinearGradient(x0,y0,x0+180,y0-70);l.addColorStop(0,`rgba(${AC2},.9)`);l.addColorStop(1,'rgba(255,255,255,0)');bgc.strokeStyle=l;bgc.lineWidth=3;bgc.beginPath();bgc.moveTo(x0,y0);bgc.lineTo(x0+180,y0-70);bgc.stroke();}
  vign(.55);},
 tiles(T){bgc.fillStyle=`rgb(${BG1.join(',')})`;bgc.fillRect(0,0,W,H);const s=V?260:240;bgc.save();bgc.translate(W/2,H/2);bgc.rotate(T*.02);bgc.translate(-W/2,-H/2);
  for(let y=-s*2;y<H+s*2;y+=s)for(let x=-s*2;x<W+s*2;x+=s){const d=Math.hypot(x-W/2,y-H/2)/Math.max(W,H),gl=.10+.14*Math.max(0,Math.sin(T*1.4-d*9));bgc.strokeStyle=`rgba(${AC},${gl})`;bgc.lineWidth=2;star8(x,y,s*.46,0);bgc.stroke();bgc.strokeStyle=`rgba(${AC2},${gl*.6})`;bgc.lineWidth=1;star8(x,y,s*.26,Math.PI/8);bgc.stroke();
   bgc.beginPath();bgc.moveTo(x+s*.46,y);bgc.lineTo(x+s*.54,y);bgc.moveTo(x,y+s*.46);bgc.lineTo(x,y+s*.54);bgc.strokeStyle=`rgba(${AC},${gl})`;bgc.stroke();}
  bgc.restore();const q=bgc.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H)*.6);q.addColorStop(0,`rgba(${AC},.20)`);q.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=q;bgc.fillRect(0,0,W,H);vign(.7);},
 dunes(T){const g=bgc.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${BG1.join(',')})`);g.addColorStop(.55,`rgb(${mix(BG0,hx('#'+AC.split(',').map(v=>(+v).toString(16).padStart(2,'0')).join('')),.35).join(',')})`);g.addColorStop(1,`rgb(${BG1.join(',')})`);bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  const sx=V?W*.8:W*.1,sy=V?H*.07:H*.12,sr=V?110:100;const q=bgc.createRadialGradient(sx,sy,0,sx,sy,sr*4);q.addColorStop(0,`rgba(${AC2},.55)`);q.addColorStop(.25,`rgba(${AC},.18)`);q.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=q;bgc.fillRect(0,0,W,H);bgc.fillStyle=`rgba(${AC2},.85)`;bgc.beginPath();bgc.arc(sx,sy,sr*.55,0,6.283);bgc.fill();
  for(let L=0;L<4;L++){const base=H*(V?.58:.55)+L*H*(V?.09:.11),amp=40+L*25,sp=(6+L*10)*T,f=.0018+L*.0006;bgc.beginPath();bgc.moveTo(0,H);for(let x=0;x<=W;x+=12)bgc.lineTo(x,base+amp*Math.sin((x+sp)*f+L)+amp*.5*Math.sin((x+sp)*f*2.3+L*2));bgc.lineTo(W,H);bgc.closePath();bgc.fillStyle=`rgb(${mix(BG0,[0,0,0],.25+L*.2).join(',')})`;bgc.fill();bgc.strokeStyle=`rgba(${AC},${.35-L*.07})`;bgc.lineWidth=2;bgc.stroke();}
  vign(.45);},
 aurora(T){bgc.fillStyle=`rgb(${BG1.join(',')})`;bgc.fillRect(0,0,W,H);bgc.globalCompositeOperation='lighter';
  for(let r=0;r<5;r++){const c=r%2?AC2:AC,yb=H*(.15+r*.17);bgc.beginPath();for(let x=0;x<=W;x+=10){const y=yb+70*Math.sin(x*.004+T*(.3+r*.07)+r)+40*Math.sin(x*.011-T*.5+r*2);x?bgc.lineTo(x,y):bgc.moveTo(x,y);}
   for(let x=W;x>=0;x-=10){const y=yb+150+60*Math.sin(x*.005+T*(.25+r*.05)+r*3);bgc.lineTo(x,y);}bgc.closePath();const g=bgc.createLinearGradient(0,yb-80,0,yb+220);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,`rgba(${c},.16)`);g.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=g;bgc.fill();}
  bgc.globalCompositeOperation='source-over';for(const s of STARS.slice(0,90)){bgc.fillStyle=`rgba(255,255,255,${.2+.4*Math.abs(Math.sin(T*s.s+s.p))})`;bgc.fillRect(s.x,s.y,s.r,s.r);}vign(.6);},
 poly(T){for(const t of TRI){const cx=(t[0][0]+t[1][0]+t[2][0])/3,cy=(t[0][1]+t[1][1]+t[2][1])/3;const l=.5+.5*Math.sin(T*.7+cx*.004+cy*.003+t[0][2]);const c=mix(BG1,mix(BG0,hx('#'+AC.split(',').map(v=>(+v).toString(16).padStart(2,'0')).join('')),.25),l);
   bgc.fillStyle=`rgb(${c.join(',')})`;bgc.beginPath();bgc.moveTo(...t[0].slice(0,2));bgc.lineTo(...t[1].slice(0,2));bgc.lineTo(...t[2].slice(0,2));bgc.closePath();bgc.fill();bgc.strokeStyle=`rgba(${AC},.12)`;bgc.lineWidth=1;bgc.stroke();}vign(.6);},

R.book=(sc,T,t,B)=>{const k=eb(pr(t,.1,.9)),open=eo(pr(t,.6,1.2));const fl=Math.sin(T*1.5)*8,s=B.split?.75:1;
  return `<svg class="a" style="left:${B.cx-300}px;top:${B.top-40+fl}px;transform:scale(${k*s});transform-origin:center top" width="600" height="400" viewBox="-300 -200 600 400">
   <path d="M0 -150 Q-150 -180 -280 -150 L-280 150 Q-150 120 0 150Z" fill="rgba(${AC},.18)" stroke="${GOLD}" stroke-width="5"/>

   ${[0,1,2,3,4].map(i=>`<line x1="-240" y1="${-100+i*45}" x2="-40" y2="${-105+i*45}" stroke="rgba(${AC2},.6)" stroke-width="4"/>`).join('')}
   ${open>.6?[0,1,2,3,4].map(i=>`<line x1="40" y1="${-105+i*45}" x2="240" y2="${-100+i*45}" stroke="rgba(${AC2},.6)" stroke-width="4" opacity="${(open-.6)/.4}"/>`).join(''):''}
   <line x1="0" y1="-150" x2="0" y2="150" stroke="${GOLD}" stroke-width="4"/></svg>
   <div class="a q" style="left:${B.cx-B.w/2}px;width:${B.w}px;top:${B.top+400*s-20}px;text-align:center;font-size:${V?(sc.head.length>14?80:100):(B.split?90:110)}px;line-height:1.3;opacity:${eo(pr(T,cueT(sc,sc.headcue)-.2,.8))}">${sc.head}</div>

R.stats=(sc,T,t,B)=>{let h='';const n=sc.items.length;sc.items.forEach((it,i)=>{const ct=cueT(sc,it.cue),k=eb(pr(T,ct-.15,.6)),c=eo(pr(T,ct-.15,1.4));if(k<=0)return;

  h+=`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:${cl(k*1.5)};transform:translateY(${(1-k)*60}px) scale(${.85+.15*k})">
   <div style="font-family:A;font-size:${V&&B.split?120:150}px;line-height:1.1;color:${GOLD};direction:ltr;text-shadow:0 0 34px rgba(${AC},.6)">${fmt(it.num,c)}</div><div style="font-family:A;font-size:44px;color:#fff;text-align:center;padding:0 20px">${it.lab}</div></div>`});return h};
R.outro=(sc,T,t,B)=>{const k=eb(pr(t,0,.9));const cx=W/2;
  return `<svg class="a" style="left:${cx-330}px;top:${V?370:80}px" width="660" height="660"><g transform="translate(330,330) rotate(${T*20})">${[0,1,2,3,4,5,6,7].map(j=>`<circle r="${290}" cx="0" cy="0" fill="none" stroke="rgb(${palOf(j)[0].join(',')})" stroke-width="5" stroke-dasharray="${180*k} 2000" transform="rotate(${j*45})"/>`).join('')}</g></svg>
  <img class="a" src="${D.logo}" style="left:${cx-230}px;top:${V?470:180}px;width:460px;height:460px;border-radius:50%;transform:scale(${k});box-shadow:0 0 90px rgba(${AC},.5)">

function titlePhoto(sc,T,t,i){ // صورة شخصية مؤطّرة + خلفية ضبابية

// ---------- الترجمة ----------
function subs(sc,T,B){
  if(sc.type==='outro')return'';
  const cues=new Set();(sc.pts||[]).forEach(p=>cues.add(norm(p.cue)));(sc.items||[]).forEach(p=>p.cue&&cues.add(norm(p.cue)));if(sc.numcue)cues.add(norm(sc.numcue));
  const ch=[];let cur=[];for(const w of sc.words){cur.push(w);if(cur.length>=(V?4:6)||/[،,.:]$/.test(w.w)){ch.push(cur);cur=[]}}if(cur.length)ch.push(cur);
  let pick=null;for(const c of ch){if(T>=sc.voice+c[0].t-.08)pick=c}
  if(!pick||T<sc.voice+pick[0].t-.05)return'';const last=pick[pick.length-1];if(T>sc.voice+last.t+last.d+1.2)return'';
  const html=pick.filter(w=>T>=sc.voice+w.t-.05).map(w=>{const tw=sc.voice+w.t,k=eb(pr(T,tw-.05,.3));const now=T>=tw-.05&&T<tw+w.d+.1;const key=[...cues].some(c=>c&&norm(w.w).includes(c));
    const bgw=now?`background:${GOLD};color:${INK};border-radius:12px;`:`color:${key?GOLD2:'#fff'};`;
    return `<span style="display:inline-block;margin:0 4px;padding:0 10px;opacity:${cl(k*1.4)};transform:translateY(${(1-k)*24}px) scale(${.85+.15*k});${bgw}${now?'':'text-shadow:0 3px 10px #000'}">${w.w}</span>`}).join('');
  const top=V?1470:950;

  if(SY.sub==='big')return `<div class="a" style="left:${V?30:120}px;right:${V?30:120}px;top:${top-20}px;text-align:center"><span style="font-family:Q;font-size:${V?76:60}px;line-height:1.45;-webkit-text-stroke:2px rgba(0,0,0,.85);paint-order:stroke fill">${html}</span></div>`;
  return `<div class="a" style="left:${V?40:140}px;right:${V?40:140}px;top:${top}px;text-align:center"><span style="font-family:A;font-size:${V?58:48}px;line-height:1.6;background:rgba(0,0,0,.55);padding:6px 18px;border-radius:18px;border:1px solid rgba(${AC},.35)">${html}</span></div>`;
}
// ---------- الانتقال بين المشاهد ----------
function sweep(sc,t,i){if(i===0||t>.75)return'';const p=eio(pr(t,0,.75));const x=(-0.4+1.8*p)*W;
  return `<div class="a" style="left:${x-W*.35}px;top:${-H*.2}px;width:${W*.35}px;height:${H*1.4}px;transform:skewX(-18deg);background:linear-gradient(90deg,rgba(${AC},0),rgba(${AC},.55),rgba(${AC2},.9),rgba(${AC},.55),rgba(${AC},0));filter:blur(8px)"></div>
  <div class="a" style="inset:0;background:rgba(${AC2},${.25*(1-pr(t,0,.35))})"></div>`}
// ---------- الإطار ----------
function frame(T){
  let i=0;SC.forEach((s,k)=>{if(T>=s.start)i=k});const sc=SC[i],t=T-sc.start;
  setPal(T); bg(T,i);
  const isMap=sc.type==='map';
  const prevMap=i>0&&SC[i-1].type==='map';
  let mv=isMap?1:0.12;
  if(isMap&&!prevMap) mv=0.12+0.88*eo(pr(t,0,.8)); if(!isMap&&prevMap) mv=1-0.88*eo(pr(t,0,.6));
  if(sc.type==='outro') mv=0;
  const proj=drawMap(T,mv);
  let h=particles(T);
  const hasIll=(sc.ill||[]).length>0; const split=!isMap&&hasIll&&sc.type!=='outro';
  const B=split?(V?{cx:540,w:1040,top:sc.type==='title'?960:900,split:1}:{cx:1420,w:880,top:sc.type==='title'?250:190,split:1}):(V?{cx:540,w:1040,top:420}:{cx:960,w:1820,top:190});
  if(isMap&&proj){
    LABELS.forEach(L=>{const k=eb(pr(T,L.t-.05,.5));if(k<=0)return;const p=proj(L.ll);if(!p||p[0]<-100||p[0]>W+100||p[1]<-50||p[1]>H+50)return;
      const cur=L.scene===i, pulse=cur?Math.max(0,1-(T-L.t)/1.4):0, sz=(L.big?(V?64:56):(V?48:40))*(cur?1:.75);
      h+=`<svg class="a" style="left:0;top:0;overflow:visible" width="${W}" height="${H}"><circle cx="${p[0]}" cy="${p[1]}" r="${(L.big?14:9)*k}" fill="${cur?GOLD2:GOLD}" stroke="${INK}" stroke-width="3"/>
        <circle cx="${p[0]}" cy="${p[1]}" r="${20+70*(1-pulse)}" fill="none" stroke="${GOLD2}" stroke-width="4" opacity="${pulse}"/></svg>
        <div class="a" style="left:${p[0]-300}px;width:600px;top:${p[1]-sz*1.9}px;text-align:center;opacity:${cur?1:.75}"><span style="display:inline-block;font-family:${L.big?'Q':'A'};font-size:${sz*k}px;color:${cur?'#fff':GOLD2};padding:0 18px;border-radius:14px;background:${cur?`rgba(${AC},.35)`:'transparent'};text-shadow:0 0 12px #000,0 3px 8px #000">${L.n}</span></div>`;});
    if(sc.year){const k=eb(pr(t,.3,.7));h+=`<div class="a" style="left:${V?60:70}px;top:${V?220:80}px;font-family:A;font-size:${V?110:100}px;color:${GOLD};opacity:${k};transform:scale(${.7+.3*k});transform-origin:left top;text-shadow:0 0 30px rgba(${AC},.6),0 4px 12px #000">${sc.year} ${sc.era||'م'}</div>`;}
    if(sc.chapter){const k=eo(pr(t,.1,.7));h+=`<div class="a" style="left:0;right:0;top:${V?150:40}px;text-align:center;opacity:${k};transform:translateY(${(1-k)*-30}px)"><span class="q" style="font-size:52px;background:rgba(0,0,0,.55);padding:2px 34px;border-radius:30px;border:2px solid ${GOLD}">${sc.chapter}</span></div>`;}
    if(hasIll) h+=stage(sc,T,t,V?{x:150,y:890,w:780,h:540}:{x:1290,y:160,w:580,h:580},i,1);
  } else if(R[sc.type]){
    const v=Math.min(i===0?1:eo(pr(t,0,.4)),cl((sc.dur-t)/.3));
    let inner='';
    if(split) inner+=stage(sc,T,t,V?{x:40,y:110,w:1000,h:780}:{x:30,y:110,w:980,h:860},i,0);
    inner+=R[sc.type](sc,T,t,B);
    const TR=trans(sc,t,i);h+=`<div class="a" style="inset:0;opacity:${v};${TR.tf||camTf(sc,T,t)}">${inner}</div>`;

  {const c0=D.total*.42,k=eb(pr(T,c0,.45))*cl((c0+3.2-T)/.4);if(k>0&&D.total>20)h+=`<div class="a" style="left:${V?60:70}px;top:${V?150:110}px;display:flex;align-items:center;gap:14px;padding:10px 30px;border-radius:50px;background:linear-gradient(135deg,#ff3030,#c00);font-family:A;font-size:${V?46:40}px;color:#fff;opacity:${cl(k*1.4)};transform:scale(${(.6+.4*k)*(1+.05*Math.sin(T*8))});transform-origin:left center;box-shadow:0 10px 30px rgba(255,0,0,.45)"><span style="font-size:1.1em">🔔</span>تابِع حكايا الزمان</div>`;}
  h+=`<div class="a" style="left:0;bottom:0;height:6px;width:${W}px;background:rgba(255,255,255,.08)"><div style="height:100%;width:${cl(T/D.total)*100}%;margin-left:auto;background:${GOLD};box-shadow:0 0 10px ${GOLD}"></div></div>`;
  const f=cl((D.total-T)/.8);h+=`<div class="a" style="inset:0;background:#000;opacity:${1-f}"></div>`;
  st.innerHTML=h;
  return Promise.all([...document.images].filter(x=>!x.complete).map(x=>x.decode().catch(()=>0)));
}
window.frame=frame;
window.ready=Promise.all([document.fonts.ready,...[D.logo].map(s=>new Promise(r=>{const x=new Image();x.onload=x.onerror=r;x.src=s}))]);
